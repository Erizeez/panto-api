openapi: 3.0.3
info:
  title: Panto Control API
  description: Official RESTful Control Plane API for Panto (Programmable Adaptive Network Tunnel Orchestrator)
  version: 1.0.0
  contact:
    name: Panto Team
    url: https://github.com/Erizeez/panto
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /api/v1
    description: Local Panto Daemon Controller

tags:
  - name: System
    description: Daemon core lifecycle, status, version and routing mode controls
  - name: Config
    description: Active declarative configuration inspection
  - name: Topology
    description: Overlay/underlay DAG topology visualization and dynamic group selection
  - name: Rules
    description: Traffic routing rules inspection and match simulation
  - name: Flows
    description: Real-time active connection tracking and byte-level accounting
  - name: Probe
    description: Latency benchmarking across 50+ global key web services
  - name: Tailscale
    description: Tailscale exit nodes management and Magic-IP conflict decision
  - name: Observation
    description: Secondary provider usage telemetry (POPP) and user consent management

paths:
  /version:
    get:
      tags: [System]
      summary: 获取核心版本信息
      operationId: getVersion
      responses:
        '200':
          description: 版本详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'

  /status:
    get:
      tags: [System]
      summary: 获取系统运行状态与流量统计
      operationId: getStatus
      responses:
        '200':
          description: 运行时状态与网络流量
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /mode:
    get:
      tags: [System]
      summary: 获取当前运行模式与全局出口
      operationId: getMode
      responses:
        '200':
          description: 当前运行模式
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeResponse'
    put:
      tags: [System]
      summary: 切换运行模式与全局出口
      operationId: setMode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetModeRequest'
      responses:
        '200':
          description: 切换后的运行模式
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeResponse'

  /config:
    get:
      tags: [Config]
      summary: 获取当前运行态生效的原始配置文本
      operationId: getConfig
      responses:
        '200':
          description: 原始配置内容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'

  /topology:
    get:
      tags: [Topology]
      summary: 获取活跃节点网络拓扑 DAG
      operationId: getTopology
      responses:
        '200':
          description: 拓扑节点与 MTU 阶梯图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyGraph'

  /groups:
    get:
      tags: [Topology]
      summary: 获取所有出站策略组及成员状态
      operationId: getGroups
      responses:
        '200':
          description: 策略组列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupsResponse'

  /groups/{id}/select:
    put:
      tags: [Topology]
      summary: 为 selector 策略组手动切换选中的出站节点
      operationId: selectGroupMember
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 策略组 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectGroupRequest'
      responses:
        '200':
          description: 切换结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectGroupResponse'
        '404':
          description: 策略组不存在或不支持手动选择
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /groups/{id}/delay:
    post:
      tags: [Topology]
      summary: 对策略组内所有成员节点并发执行延迟测速
      operationId: testGroupDelay
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 策略组 ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupDelayRequest'
      responses:
        '200':
          description: 策略组成员测速延迟结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDelayResponse'
        '404':
          description: 策略组不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /rules:
    get:
      tags: [Rules]
      summary: 获取所有生效的分流规则列表
      operationId: getRules
      responses:
        '200':
          description: 分流规则列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesResponse'

  /rules/match:
    post:
      tags: [Rules]
      summary: 模拟流量元数据在分流规则引擎中的匹配计算
      operationId: matchRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleMatchRequest'
      responses:
        '200':
          description: 匹配计算结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleMatchResponse'

  /flows:
    get:
      tags: [Flows]
      summary: 获取实时活跃连接流列表及吞吐量快照
      operationId: getFlows
      responses:
        '200':
          description: 活跃网络流列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowsResponse'

  /probe/sites:
    get:
      tags: [Probe]
      summary: 获取预置全球基准测试站点列表
      operationId: getProbeSites
      responses:
        '200':
          description: 预置站点列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeSitesResponse'

  /probe/test:
    post:
      tags: [Probe]
      summary: 对指定或全部预置网站执行分流解析与连通性测速
      operationId: testProbeSites
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProbeTestRequest'
      responses:
        '200':
          description: 批量探测结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeTestResponse'

  /probe/stream:
    get:
      tags: [Probe]
      summary: 获取实时流式并发测速 SSE 事件流
      operationId: streamProbeSites
      parameters:
        - name: timeout_ms
          in: query
          required: false
          schema:
            type: integer
            default: 3000
          description: 单站点探测超时毫秒数
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: 可选过滤站点分类
      responses:
        '200':
          description: 逐站点返回的实时测速 SSE 事件流 (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
                description: JSON-formatted ProbeResultItem events

  /tailscale/exit-nodes:
    get:
      tags: [Tailscale]
      summary: 获取 Tailnet 中所有可供消费的远端 Exit Node 列表
      operationId: getTailscaleExitNodes
      responses:
        '200':
          description: 出口节点列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TailscaleExitNodesResponse'
    put:
      tags: [Tailscale]
      summary: 设置当前消费的远端 Exit Node（空字符串表示停用）
      operationId: setTailscaleExitNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTailscaleExitNodeRequest'
      responses:
        '200':
          description: 出口节点切换结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TailscaleExitNodeResult'

  /tailscale/magic-ip/pending:
    get:
      tags: [Tailscale]
      summary: 获取当前待处理的 Magic-IP 冲突列表
      operationId: getMagicIPPending
      responses:
        '200':
          description: 冲突列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MagicIPPendingResponse'

  /tailscale/magic-ip/choices:
    get:
      tags: [Tailscale]
      summary: 获取用户已做出的 Magic-IP 路由裁决历史记录
      operationId: getMagicIPChoices
      responses:
        '200':
          description: 路由裁决记录列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MagicIPChoicesResponse'

  /tailscale/magic-ip/decide:
    post:
      tags: [Tailscale]
      summary: 提交特定冲突 IP 的设备归属裁决
      operationId: decideMagicIP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicIPDecideRequest'
      responses:
        '200':
          description: 裁决提交成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MagicIPDecideResponse'

  /tailscale/magic-ip/choices/{ip}:
    delete:
      tags: [Tailscale]
      summary: 撤销或清除指定 IP 的历史路由裁决
      operationId: deleteMagicIPChoice
      parameters:
        - name: ip
          in: path
          required: true
          schema:
            type: string
          description: 目标 IP 地址
      responses:
        '200':
          description: 清除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MagicIPDeleteResponse'

  /observation/consents:
    get:
      tags: [Observation]
      summary: 获取所有节点的用量观测授权申请列表
      operationId: getObservationConsents
      responses:
        '200':
          description: 授权申请列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObservationConsentItem'

  /observation/consents/{id}/decide:
    post:
      tags: [Observation]
      summary: 用户提交对特定节点的用量观测授权决定 (granted 或 denied)
      operationId: decideObservationConsent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 节点唯一 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideConsentRequest'
      responses:
        '200':
          description: 决策成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecideConsentResponse'
        '400':
          description: 非法请求参数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 节点不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /observation/consents/{id}:
    delete:
      tags: [Observation]
      summary: 撤销对特定节点的用量观测授权 (改为 revoked)
      operationId: revokeObservationConsent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 节点唯一 ID
      responses:
        '200':
          description: 撤销成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecideConsentResponse'
        '404':
          description: 节点不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /observation/status:
    get:
      tags: [Observation]
      summary: 获取用量观测推送引擎诊断与历史推送状态
      operationId: getObservationStatus
      responses:
        '200':
          description: 推送引擎运行诊断数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationStatusResponse'

components:
  schemas:
    # ── 通用与系统模型 ──────────────────────────────────────────────────
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: 错误详情描述

    VersionResponse:
      type: object
      required:
        - version
        - git_commit
        - build_time
        - compiler
      properties:
        version:
          type: string
          example: "0.1.0"
        git_commit:
          type: string
          example: "fe9aeb4"
        build_time:
          type: string
          example: "2026-09-19"
        compiler:
          type: string
          example: "rustc 1.95 (Zero-GC Edition)"

    TrafficStats:
      type: object
      required:
        - upload_total
        - download_total
      properties:
        upload_total:
          type: integer
          format: int64
          description: 累计上传字节数
        download_total:
          type: integer
          format: int64
          description: 累计下载字节数
        upload_rate_bps:
          type: integer
          format: int64
          description: 当前上传瞬时速率 (字节/秒)
        download_rate_bps:
          type: integer
          format: int64
          description: 当前下载瞬时速率 (字节/秒)

    StatusResponse:
      type: object
      required:
        - running
        - mode
        - global_exit
        - uptime_seconds
        - connections_count
        - traffic
      properties:
        running:
          type: boolean
          description: 后台守护进程是否就绪运行
        mode:
          type: string
          description: 当前工作模式 (rule, global, direct)
          example: "rule"
        global_exit:
          type: string
          description: 全局出口节点或策略组 ID
          example: "DIRECT"
        uptime_seconds:
          type: integer
          format: int64
          description: 进程启动运行秒数
        connections_count:
          type: integer
          format: int64
          description: 当前活跃连接流数量
        traffic:
          $ref: '#/components/schemas/TrafficStats'

    ModeResponse:
      type: object
      required:
        - mode
        - global_exit
      properties:
        mode:
          type: string
          example: "rule"
        global_exit:
          type: string
          example: "DIRECT"

    SetModeRequest:
      type: object
      required:
        - mode
      properties:
        mode:
          type: string
          example: "global"
        global_exit:
          type: string
          example: "ss-hk"

    ConfigResponse:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          description: 生效的原始 YAML 配置内容
        version:
          type: string
          nullable: true
          description: 配置格式版本

    # ── 拓扑与路由模型 ──────────────────────────────────────────────────
    TopologyNode:
      type: object
      required:
        - id
        - kind
        - effective_mtu
        - overhead
        - dependents
        - path
      properties:
        id:
          type: string
        kind:
          type: string
        underlay:
          type: string
          nullable: true
        effective_mtu:
          type: integer
        overhead:
          type: integer
        dependents:
          type: array
          items:
            type: string
        path:
          type: array
          items:
            type: string

    TopologyGraph:
      type: object
      required:
        - nodes
        - root
      properties:
        nodes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TopologyNode'
        root:
          type: string
          example: "DIRECT"

    GroupItem:
      type: object
      required:
        - id
        - kind
        - members
      properties:
        id:
          type: string
        kind:
          type: string
        members:
          type: array
          items:
            type: string
        selected:
          type: string
          nullable: true

    GroupsResponse:
      type: object
      required:
        - groups
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupItem'

    SelectGroupRequest:
      type: object
      required:
        - selected
      properties:
        selected:
          type: string
          description: 目标节点 ID
          example: "wireguard-tokyo"

    SelectGroupResponse:
      type: object
      required:
        - success
        - group_id
        - selected
      properties:
        success:
          type: boolean
        group_id:
          type: string
        selected:
          type: string

    GroupDelayRequest:
      type: object
      properties:
        url:
          type: string
          description: 自定义探测测试 URL
          example: "http://cp.cloudflare.com/generate_204"
        timeout_ms:
          type: integer
          format: int64
          default: 3000
          description: 测速超时毫秒

    GroupDelayResponse:
      type: object
      required:
        - group_id
        - delays
      properties:
        group_id:
          type: string
        delays:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: 节点 ID 对应 RTT 延迟 (ms)

    # ── 规则引擎模型 ────────────────────────────────────────────────────
    RuleItem:
      type: object
      required:
        - raw
        - matcher
        - target
      properties:
        raw:
          type: string
          example: "DOMAIN-SUFFIX,google.com,Global-Proxy"
        matcher:
          type: string
          example: "DOMAIN-SUFFIX,google.com"
        target:
          type: string
          example: "Global-Proxy"

    RulesResponse:
      type: object
      required:
        - total
        - rules
      properties:
        total:
          type: integer
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleItem'

    RuleMatchRequest:
      type: object
      properties:
        domain:
          type: string
          example: "google.com"
        ip:
          type: string
          example: "142.250.190.46"
        port:
          type: integer
          example: 443
        protocol:
          type: string
          example: "TCP"

    RuleMatchResponse:
      type: object
      required:
        - matched
      properties:
        matched:
          type: boolean
        rule:
          type: string
          nullable: true
          example: "DOMAIN-SUFFIX,google.com,Global-Proxy"
        target:
          type: string
          nullable: true
          example: "Global-Proxy"

    # ── 流量与网络流模型 ────────────────────────────────────────────────
    FlowRecord:
      type: object
      required:
        - id
        - proto
        - src
        - dst
        - target
        - created_at_ms
        - last_active_at_ms
        - upload_bytes
        - download_bytes
        - packets
      properties:
        id:
          type: string
        proto:
          type: string
          example: "TCP"
        src:
          type: string
          example: "127.0.0.1:52134"
        dst:
          type: string
          example: "1.1.1.1:443"
        target:
          type: string
          example: "wireguard-tokyo"
        rule:
          type: string
          nullable: true
          example: "DOMAIN-SUFFIX,google.com,Global-Proxy"
        created_at_ms:
          type: integer
          format: int64
        last_active_at_ms:
          type: integer
          format: int64
        upload_bytes:
          type: integer
          format: int64
        download_bytes:
          type: integer
          format: int64
        packets:
          type: integer
          format: int64

    FlowsResponse:
      type: object
      required:
        - total
        - flows
      properties:
        total:
          type: integer
        flows:
          type: array
          items:
            $ref: '#/components/schemas/FlowRecord'

    # ── 站点测速模型 ────────────────────────────────────────────────────
    ProbeSite:
      type: object
      required:
        - id
        - name
        - domain
        - port
        - category
        - icon
        - description
      properties:
        id:
          type: string
        name:
          type: string
        domain:
          type: string
        port:
          type: integer
        category:
          type: string
        icon:
          type: string
        description:
          type: string

    ProbeSitesResponse:
      type: object
      required:
        - sites
      properties:
        sites:
          type: array
          items:
            $ref: '#/components/schemas/ProbeSite'

    ProbeTestRequest:
      type: object
      properties:
        site_id:
          type: string
        category:
          type: string
        timeout_ms:
          type: integer
          format: int64
          default: 3000
        proxy_addr:
          type: string

    ProbeResultItem:
      type: object
      required:
        - id
        - name
        - domain
        - category
        - latency_ms
        - status
      properties:
        id:
          type: string
        name:
          type: string
        domain:
          type: string
        category:
          type: string
        latency_ms:
          type: integer
          format: int64
        status:
          type: string
          enum: [ok, timeout, error, blocked]
        error:
          type: string
          nullable: true

    ProbeTestResponse:
      type: object
      required:
        - total
        - reachable
        - failed
        - results
      properties:
        total:
          type: integer
        reachable:
          type: integer
        failed:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProbeResultItem'

    # ── Tailscale 出口与 Magic-IP 模型 ──────────────────────────────────
    TailscaleExitNodeItem:
      type: object
      required:
        - id
        - name
        - ip
        - online
        - active
      properties:
        id:
          type: string
        name:
          type: string
        ip:
          type: string
        online:
          type: boolean
        active:
          type: boolean
        location:
          type: string
          nullable: true

    TailscaleExitNodesResponse:
      type: object
      required:
        - exit_nodes
      properties:
        exit_nodes:
          type: array
          items:
            $ref: '#/components/schemas/TailscaleExitNodeItem'

    SetTailscaleExitNodeRequest:
      type: object
      required:
        - node_id
      properties:
        node_id:
          type: string
          description: 目标出口节点 ID，空字符串表示关闭出口节点

    TailscaleExitNodeResult:
      type: object
      required:
        - active_node
      properties:
        active_node:
          type: string
          description: 当前生效激活的出口节点 ID

    MagicIPCandidate:
      type: object
      required:
        - ip
        - device_name
        - source
      properties:
        ip:
          type: string
        device_name:
          type: string
        source:
          type: string

    MagicIPConflictItem:
      type: object
      required:
        - conflict_ip
        - candidates
      properties:
        conflict_ip:
          type: string
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/MagicIPCandidate'

    MagicIPPendingResponse:
      type: object
      required:
        - conflicts
      properties:
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/MagicIPConflictItem'

    MagicIPChoiceItem:
      type: object
      required:
        - ip
        - chosen_device
      properties:
        ip:
          type: string
        chosen_device:
          type: string

    MagicIPChoicesResponse:
      type: object
      required:
        - choices
      properties:
        choices:
          type: array
          items:
            $ref: '#/components/schemas/MagicIPChoiceItem'

    MagicIPDecideRequest:
      type: object
      required:
        - conflict_ip
        - chosen_device
      properties:
        conflict_ip:
          type: string
        chosen_device:
          type: string

    MagicIPDecideResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: "decided"

    MagicIPDeleteResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: "cleared"

    # ── 用量观测模型 ────────────────────────────────────────────────────
    ObservationConsentItem:
      type: object
      required:
        - node_id
        - url
        - status
        - requested_at_ms
      properties:
        node_id:
          type: string
          description: 节点唯一 ID
        provider_name:
          type: string
          nullable: true
          description: 次级提供商展示名称
        url:
          type: string
          description: 推送用量接收端 URL
        status:
          type: string
          enum:
            - pending
            - granted
            - denied
            - revoked
          description: 授权状态
        requested_at_ms:
          type: integer
          format: int64
          description: 申请发起毫秒时间戳
        decided_at_ms:
          type: integer
          format: int64
          nullable: true
          description: 用户决策毫秒时间戳

    DecideConsentRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - granted
            - denied
          description: 决策结果

    DecideConsentResponse:
      type: object
      required:
        - success
        - node_id
        - status
      properties:
        success:
          type: boolean
        node_id:
          type: string
        status:
          type: string

    PushResultRecord:
      type: object
      required:
        - last_pushed_at_ms
        - success
        - upload_bytes
        - download_bytes
      properties:
        last_pushed_at_ms:
          type: integer
          format: int64
        success:
          type: boolean
        message:
          type: string
          nullable: true
        upload_bytes:
          type: integer
          format: int64
        download_bytes:
          type: integer
          format: int64

    ObservationStatusResponse:
      type: object
      required:
        - running
        - active_nodes
        - pending_nodes
        - last_push_results
      properties:
        running:
          type: boolean
        active_nodes:
          type: integer
        pending_nodes:
          type: integer
        last_push_results:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PushResultRecord'
