openapi: 3.0.3
info:
  title: Panto Control API
  description: Official RESTful Control Plane API for Panto (Programmable Adaptive Network Tunnel Orchestrator)
  version: 1.0.0
  contact:
    name: Panto Team
    url: https://github.com/Erizeez/panto
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /api/v1
    description: Local Panto Daemon Controller

tags:
  - name: System
    description: Daemon core lifecycle, status, version and routing mode controls
  - name: Topology
    description: Overlay/underlay DAG topology visualization and dynamic group selection
  - name: Flows
    description: Real-time active connection tracking and byte-level accounting
  - name: Probe
    description: Latency benchmarking across 50+ global key web services
  - name: Observation
    description: Secondary provider usage telemetry (POPP) and user consent management

paths:
  /version:
    get:
      tags: [System]
      summary: 获取核心版本信息
      operationId: getVersion
      responses:
        '200':
          description: 版本详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'

  /status:
    get:
      tags: [System]
      summary: 获取系统运行状态与流量统计
      operationId: getStatus
      responses:
        '200':
          description: 运行时状态与网络流量
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /mode:
    get:
      tags: [System]
      summary: 获取当前运行模式与全局出口
      operationId: getMode
      responses:
        '200':
          description: 当前运行模式
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeResponse'
    put:
      tags: [System]
      summary: 切换运行模式与全局出口
      operationId: setMode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetModeRequest'
      responses:
        '200':
          description: 切换后的运行模式
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeResponse'

  /topology:
    get:
      tags: [Topology]
      summary: 获取活跃节点网络拓扑 DAG
      operationId: getTopology
      responses:
        '200':
          description: 拓扑节点与 MTU 阶梯图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyGraph'

  /groups:
    get:
      tags: [Topology]
      summary: 获取所有出站策略组及成员状态
      operationId: getGroups
      responses:
        '200':
          description: 策略组列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupsResponse'

  /groups/{id}/select:
    put:
      tags: [Topology]
      summary: 为 selector 策略组手动切换选中的出站节点
      operationId: selectGroupMember
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 策略组 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectGroupRequest'
      responses:
        '200':
          description: 切换结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectGroupResponse'
        '404':
          description: 策略组不存在或不支持手动选择
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /flows:
    get:
      tags: [Flows]
      summary: 获取实时活跃连接流列表及吞吐量快照
      operationId: getFlows
      responses:
        '200':
          description: 活跃网络流列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowsResponse'

  /probe/sites:
    get:
      tags: [Probe]
      summary: 获取预置全球基准测试站点列表
      operationId: getProbeSites
      responses:
        '200':
          description: 预置站点列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeSitesResponse'

  /probe/test:
    post:
      tags: [Probe]
      summary: 对指定或全部预置网站执行分流解析与连通性测速
      operationId: testProbeSites
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProbeTestRequest'
      responses:
        '200':
          description: 批量探测结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeTestResponse'

  /observation/consents:
    get:
      tags: [Observation]
      summary: 获取所有节点的用量观测授权申请列表
      operationId: getObservationConsents
      responses:
        '200':
          description: 授权申请列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObservationConsentItem'

  /observation/consents/{id}/decide:
    post:
      tags: [Observation]
      summary: 用户提交对特定节点的用量观测授权决定 (granted 或 denied)
      operationId: decideObservationConsent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 节点唯一 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideConsentRequest'
      responses:
        '200':
          description: 决策成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecideConsentResponse'
        '400':
          description: 非法请求参数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 节点不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /observation/consents/{id}:
    delete:
      tags: [Observation]
      summary: 撤销对特定节点的用量观测授权 (改为 revoked)
      operationId: revokeObservationConsent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 节点唯一 ID
      responses:
        '200':
          description: 撤销成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecideConsentResponse'
        '404':
          description: 节点不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /observation/status:
    get:
      tags: [Observation]
      summary: 获取用量观测推送引擎诊断与历史推送状态
      operationId: getObservationStatus
      responses:
        '200':
          description: 推送引擎运行诊断数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationStatusResponse'

components:
  schemas:
    # ── 通用模型 ────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: 错误详情描述

    VersionResponse:
      type: object
      required:
        - version
        - git_commit
        - build_time
        - compiler
      properties:
        version:
          type: string
          example: "0.1.0"
        git_commit:
          type: string
          example: "fe9aeb4"
        build_time:
          type: string
          example: "2026-09-19"
        compiler:
          type: string
          example: "rustc 1.95 (Zero-GC Edition)"

    TrafficStats:
      type: object
      required:
        - upload_total
        - download_total
      properties:
        upload_total:
          type: integer
          format: int64
          description: 累计上传字节数
        download_total:
          type: integer
          format: int64
          description: 累计下载字节数
        upload_rate_bps:
          type: integer
          format: int64
          description: 当前上传瞬时速率 (字节/秒)
        download_rate_bps:
          type: integer
          format: int64
          description: 当前下载瞬时速率 (字节/秒)

    StatusResponse:
      type: object
      required:
        - running
        - mode
        - global_exit
        - uptime_seconds
        - connections_count
        - traffic
      properties:
        running:
          type: boolean
          description: 后台守护进程是否就绪运行
        mode:
          type: string
          description: 当前工作模式 (rule, global, direct)
          example: "rule"
        global_exit:
          type: string
          description: 全局出口节点或策略组 ID
          example: "DIRECT"
        uptime_seconds:
          type: integer
          format: int64
          description: 进程启动运行秒数
        connections_count:
          type: integer
          format: int64
          description: 当前活跃连接流数量
        traffic:
          $ref: '#/components/schemas/TrafficStats'

    ModeResponse:
      type: object
      required:
        - mode
        - global_exit
      properties:
        mode:
          type: string
          example: "rule"
        global_exit:
          type: string
          example: "DIRECT"

    SetModeRequest:
      type: object
      required:
        - mode
      properties:
        mode:
          type: string
          example: "global"
        global_exit:
          type: string
          example: "ss-hk"

    # ── 拓扑与路由模型 ──────────────────────────────────────────────────
    TopologyNode:
      type: object
      required:
        - id
        - kind
        - effective_mtu
        - overhead
        - dependents
        - path
      properties:
        id:
          type: string
        kind:
          type: string
        underlay:
          type: string
          nullable: true
        effective_mtu:
          type: integer
        overhead:
          type: integer
        dependents:
          type: array
          items:
            type: string
        path:
          type: array
          items:
            type: string

    TopologyGraph:
      type: object
      required:
        - nodes
        - root
      properties:
        nodes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TopologyNode'
        root:
          type: string
          example: "DIRECT"

    GroupItem:
      type: object
      required:
        - id
        - kind
        - members
      properties:
        id:
          type: string
        kind:
          type: string
        members:
          type: array
          items:
            type: string
        selected:
          type: string
          nullable: true

    GroupsResponse:
      type: object
      required:
        - groups
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupItem'

    SelectGroupRequest:
      type: object
      required:
        - selected
      properties:
        selected:
          type: string
          description: 目标节点 ID
          example: "wireguard-tokyo"

    SelectGroupResponse:
      type: object
      required:
        - success
        - group_id
        - selected
      properties:
        success:
          type: boolean
        group_id:
          type: string
        selected:
          type: string

    # ── 流量与网络流模型 ────────────────────────────────────────────────
    FlowRecord:
      type: object
      required:
        - id
        - proto
        - src
        - dst
        - target
        - created_at_ms
        - last_active_at_ms
        - upload_bytes
        - download_bytes
        - packets
      properties:
        id:
          type: string
        proto:
          type: string
          example: "TCP"
        src:
          type: string
          example: "127.0.0.1:52134"
        dst:
          type: string
          example: "1.1.1.1:443"
        target:
          type: string
          example: "wireguard-tokyo"
        rule:
          type: string
          nullable: true
          example: "DOMAIN-SUFFIX,google.com,Global-Proxy"
        created_at_ms:
          type: integer
          format: int64
        last_active_at_ms:
          type: integer
          format: int64
        upload_bytes:
          type: integer
          format: int64
        download_bytes:
          type: integer
          format: int64
        packets:
          type: integer
          format: int64

    FlowsResponse:
      type: object
      required:
        - total
        - flows
      properties:
        total:
          type: integer
        flows:
          type: array
          items:
            $ref: '#/components/schemas/FlowRecord'

    # ── 站点测速模型 ────────────────────────────────────────────────────
    ProbeSite:
      type: object
      required:
        - id
        - name
        - domain
        - port
        - category
        - icon
        - description
      properties:
        id:
          type: string
        name:
          type: string
        domain:
          type: string
        port:
          type: integer
        category:
          type: string
        icon:
          type: string
        description:
          type: string

    ProbeSitesResponse:
      type: object
      required:
        - sites
      properties:
        sites:
          type: array
          items:
            $ref: '#/components/schemas/ProbeSite'

    ProbeTestRequest:
      type: object
      properties:
        site_id:
          type: string
        category:
          type: string
        timeout_ms:
          type: integer
          format: int64
          default: 3000
        proxy_addr:
          type: string

    ProbeResultItem:
      type: object
      required:
        - id
        - name
        - domain
        - category
        - latency_ms
        - status
      properties:
        id:
          type: string
        name:
          type: string
        domain:
          type: string
        category:
          type: string
        latency_ms:
          type: integer
          format: int64
        status:
          type: string
          enum: [ok, timeout, error, blocked]
        error:
          type: string
          nullable: true

    ProbeTestResponse:
      type: object
      required:
        - total
        - reachable
        - failed
        - results
      properties:
        total:
          type: integer
        reachable:
          type: integer
        failed:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProbeResultItem'

    # ── 用量观测模型 ────────────────────────────────────────────────────
    ObservationConsentItem:
      type: object
      required:
        - node_id
        - url
        - status
        - requested_at_ms
      properties:
        node_id:
          type: string
          description: 节点唯一 ID
        provider_name:
          type: string
          nullable: true
          description: 次级提供商展示名称
        url:
          type: string
          description: 推送用量接收端 URL
        status:
          type: string
          enum:
            - pending
            - granted
            - denied
            - revoked
          description: 授权状态
        requested_at_ms:
          type: integer
          format: int64
          description: 申请发起毫秒时间戳
        decided_at_ms:
          type: integer
          format: int64
          nullable: true
          description: 用户决策毫秒时间戳

    DecideConsentRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - granted
            - denied
          description: 决策结果

    DecideConsentResponse:
      type: object
      required:
        - success
        - node_id
        - status
      properties:
        success:
          type: boolean
        node_id:
          type: string
        status:
          type: string

    PushResultRecord:
      type: object
      required:
        - last_pushed_at_ms
        - success
        - upload_bytes
        - download_bytes
      properties:
        last_pushed_at_ms:
          type: integer
          format: int64
        success:
          type: boolean
        message:
          type: string
          nullable: true
        upload_bytes:
          type: integer
          format: int64
        download_bytes:
          type: integer
          format: int64

    ObservationStatusResponse:
      type: object
      required:
        - running
        - active_nodes
        - pending_nodes
        - last_push_results
      properties:
        running:
          type: boolean
        active_nodes:
          type: integer
        pending_nodes:
          type: integer
        last_push_results:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PushResultRecord'
