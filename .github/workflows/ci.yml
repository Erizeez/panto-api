name: Multi-SDK CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-go:
    name: Test Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Verify Code Generation Freshness
        run: |
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.4.1 -package pantoapi -generate types -o go/types.gen.go openapi.yaml
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.4.1 -package pantoapi -generate client -o go/client.gen.go openapi.yaml
          git diff --exit-code go/
      - name: Build and Test Go SDK
        working-directory: ./go
        run: |
          go build ./...
          go test -v ./...

  test-ts:
    name: Test TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install, Build and Test TypeScript SDK
        working-directory: ./ts
        run: |
          npm install
          npm run build
          npm test

  test-rust:
    name: Test Rust SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check and Test Rust SDK
        working-directory: ./rust
        run: |
          cargo check --verbose
          cargo test --verbose
